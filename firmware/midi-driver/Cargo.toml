[package]
name = "midi-driver"
version = "0.1.0"
authors = ["Bradley Gannon <bradley@bradleygannon.com>"]
edition = "2021"

[[bin]]
name = "midi-driver"
test = false
doctest = false
bench = false

[dependencies]
cortex-m = "0.7.7"
embedded-hal = "1.0.0"
common = { path = "../common" }
fugit = "0.3.7"
heapless = "0.8.0"
midi-convert = "0.2.0"
teensy4-panic = "0.2.3"
usbd-midi = "0.5.0"
usbd-serial = "0.2.2"
usb-device = { version = "0.3.2", features = ["control-buffer-256"] }
rtic = { version = "2.2.0", features = ["thumbv7-backend"] }

[dependencies.teensy4-bsp]
git = "https://github.com/bmgxyz/teensy4-rs"
rev = "7e6887d"
features = ["rt"]

[profile.dev]
# Without these changes, the code is too slow and panics after a few notes
opt-level = 3
overflow-checks = false
